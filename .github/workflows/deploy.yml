name: Deploy

# Every push to main builds and ships to Cloudflare. Before this, deploying
# meant `npm run build && npx wrangler deploy` on a machine with Node, git and
# a Cloudflare login -- which meant deploys could only happen from one laptop,
# and any drift between that laptop's node_modules and the lockfile shipped
# silently. Building in a clean runner from `npm ci` removes both problems.
#
# Nothing here needs a .env file: src/lib/supabase.ts falls back to the project
# URL and the publishable anon key. VITE_SENTRY_DSN and VITE_FIREBASE_VAPID_KEY
# are optional in the sense that a build without them still succeeds -- Sentry
# stays inert and the push opt-in button hides itself -- but both are set as
# repo secrets today and should stay that way; see the comments at their env:
# line below for what silently breaks if either one goes missing again.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN -- dash.cloudflare.com/profile/api-tokens,
#                           "Edit Cloudflare Workers" template
#
# The account ID is not a secret and lives in wrangler.jsonc.

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit --
  # useful when a deploy failed for a reason outside the code, like an expired
  # token.
  workflow_dispatch:

# Two pushes in quick succession would otherwise race, and whichever deploy
# finished last would win regardless of which commit it carried. Queue instead,
# and do not cancel a deploy already in progress -- a half-uploaded asset set is
# worse than a slightly stale one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to an exact patch, not just the major version. '22' let
      # actions/setup-node resolve whatever the latest 22.x.y happened to be
      # on the day a given workflow ran, and three consecutive
      # documentation-only merges produced two different bundles alternating
      # (index-6kzSssPR.js -> index-BumT0NQQ.js -> index-6kzSssPR.js, a
      # 77,858-byte swing, from source that had not changed) -- confirmed
      # locally that two builds of the identical commit on one fixed Node
      # version are byte-for-byte identical, so version drift across runs
      # was the only remaining explanation. Keep this in sync with .nvmrc
      # and package.json's engines.node.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so a type error fails the
      # deploy here rather than shipping. This duplicates the CI workflow's
      # check on purpose: CI gates the PR, this gates the artifact that is
      # actually uploaded.
      # VITE_FIREBASE_VAPID_KEY was never passed to any build, so
      # VAPID_PUBLIC_KEY was undefined in every deployed bundle, pushSupport()
      # returned 'unconfigured', and EnablePushButton rendered NOTHING. That is
      # why push_tokens has stayed at 0 across every device and both platforms:
      # not an iOS restriction, not a permission problem -- the button that
      # registers a token has never existed in production.
      #
      # This key is the PUBLIC half of a VAPID pair and ships inside the client
      # bundle by design; it is a secret here only so it is configured in one
      # place rather than committed.
      # VITE_SENTRY_DSN was never set either, so main.tsx's Sentry.init() guard
      # (`if (SENTRY_DSN)`) never ran -- error monitoring has been completely
      # inert since the SDK was first added. Same pattern as the VAPID key
      # above: this is the DSN half of a Sentry client key, meant to ship in
      # the bundle, not a credential that grants access on its own.
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # Wrangler is pinned exactly in package.json and installed by `npm ci`, so
      # the deploy uses the same version that `wrangler deploy --dry-run`
      # passes against locally.
      #
      # It was previously left to `npx --no-install wrangler`, which resolves
      # whatever the GitHub runner image happens to have cached. That silently
      # became 3.90.0, which predates assets-only Workers and fails with
      # "Missing entry-point: ... or the `main` config field" -- this project
      # has no `main`, it ships ./dist as static assets. Nothing in the repo
      # changed; the runner did. A version this deploy depends on does not
      # belong in someone else's cache.
      # Run that pinned local Wrangler directly. This avoids a second action
      # runtime and keeps the deploy path identical to local dry-runs.
      - name: Deploy to Cloudflare Workers
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # landing/ is the marketing site on gosalka.com -- a separate assets-only
  # Worker (gosalka-landing) from the app Worker deployed above
  # (appgosalka-platform). It had no deploy step at all until now: the site was
  # live and serving, but every change to it went up by hand from someone's
  # laptop with `wrangler deploy`, which is exactly the drift this workflow was
  # created to remove for the app. Same runner, same pinned Wrangler, same
  # token.
  #
  # Its own job rather than a step in the one above because the two are
  # independent: hand-written HTML with no build, no npm ci, and no reason for
  # a failed app build to block a copy fix on the marketing page (or the
  # reverse).
  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 2 so the guard below can diff against the previous commit.
      # The default shallow checkout has no parent to compare with.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Most pushes to main touch src/ and not landing/. Re-uploading an
      # unchanged asset set is harmless but it burns a deploy and makes the
      # Worker's modified_on meaningless as a signal of when the marketing copy
      # last actually changed.
      #
      # Deliberately fails open: if the diff cannot be computed (first commit,
      # a force-push that orphaned the parent, workflow_dispatch on a shallow
      # ref), deploy rather than skip. A redundant deploy costs seconds; a
      # silently skipped one means the live site does not match main.
      - name: Check whether landing/ changed
        id: changed
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            if git diff --name-only HEAD^ HEAD | grep -q '^landing/'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "landing/ unchanged in this push -- skipping deploy."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit to diff against -- deploying to be safe."
          fi

      # Wrangler is a devDependency and landing/ has no package.json of its
      # own, so install from the repo root to get the same pinned version the
      # app deploy uses. --ignore-scripts and --no-audit because nothing here
      # is built or run -- this only needs the wrangler binary on disk.
      - uses: actions/setup-node@v6
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install Wrangler
        if: steps.changed.outputs.run == 'true'
        run: npm ci --ignore-scripts --no-audit

      # --config points at landing/wrangler.jsonc, whose `assets.directory` is
      # "." -- resolved relative to the config file, so this uploads landing/
      # itself with no build output involved.
      - name: Deploy landing to Cloudflare Workers
        if: steps.changed.outputs.run == 'true'
        run: npx --no-install wrangler deploy --config landing/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
