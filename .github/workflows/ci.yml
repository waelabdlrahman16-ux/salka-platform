name: CI

# There is no staging environment, so every merge to main goes straight to
# production. Two gates stand in front of that:
#
#   build  -- refuses anything that does not typecheck or compile. Runs on every
#             push to every branch.
#   smoke  -- places a real order and rolls it back, so a change that breaks
#             ordering cannot reach main. Runs on pull requests only.
#
# The build gate alone was not enough. On 2026-08-13 checkout, pickup and custom
# orders were dead for two hours behind a change that typechecked and compiled
# perfectly -- the break was inside a Postgres function body, where `tsc` cannot
# look. See scripts/smoke-place-order.mjs.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Exact patch pin -- see the matching comment in deploy.yml for why.
      # Keep in sync with .nvmrc and package.json's engines.node.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # landing/ is hand-written static HTML with no build step, so nothing to do there.
      - name: Typecheck and build
        run: npm run build

      # Audit finding 15. Runs AFTER the build on purpose: a broken build is the
      # more urgent signal, and seeing it first saves reading lint output for a
      # branch that does not compile.
      #
      # Now fails on WARNINGS too (--max-warnings 0), which it deliberately did
      # not when the lint step was added. At that point there were 21
      # exhaustive-deps warnings and blocking merges on them would have got the
      # whole step deleted within a week. All 21 have since been read one at a
      # time: four were real and fixed, seventeen were correct code the rule
      # cannot verify statically and now carry a suppression that says why.
      #
      # At zero, the gate is worth having: the next warning is a NEW one, and it
      # is visible instead of being lost among twenty-one standing ones. If it
      # turns out to be another false positive, suppress it WITH A REASON like
      # the others -- an undocumented disable is how the count creeps back.
      - name: Lint
        run: npm run lint

  # Places a real order against a test restaurant and rolls it back. See
  # scripts/smoke-place-order.mjs for why all three safety layers are needed.
  #
  # PULL REQUESTS ONLY, not every branch push. It touches production, so it runs
  # where it changes a decision -- at the gate before merge -- rather than on
  # every intermediate commit.
  smoke-order:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # One at a time. Two concurrent runs would race on the same rate-limit
    # bucket and on the test restaurant's state.
    concurrency:
      group: smoke-order-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The secret is optional ON PURPOSE, so this workflow can merge before the
      # secret exists. Without it the job reports skipped-and-why rather than
      # failing every pull request, and without this guard the run would fail
      # with an opaque connection error instead.
      - name: Check for database credentials
        id: creds
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL secret is not set -- the order smoke test did NOT run. Ordering is unverified for this change. Add it under Settings → Secrets and variables → Actions."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      # Retried once, then the exit code decides what the failure MEANS:
      #
      #   1  ordering is broken     -> the thing this job exists to catch
      #   2  the check could not run -> bad secret, network, missing fixture
      #
      # Both fail the job, because an unverified checkout should not merge
      # either. But they must not read the same: a mistyped secret announcing
      # "ordering is broken" is how a check earns a reputation for lying, and a
      # check nobody believes is worse than no check.
      - name: Exercise the money functions and roll them back
        # Same shape and same safety as the order smoke test below: one
        # transaction, always rolled back, fixtures created inside it. 24
        # assertions across settle_driver_earnings, settle_driver_cash,
        # credit_wallet and mark_refunded -- the amounts, the idempotency, the
        # recorded actor, the rejections, and that each refuses a non-admin.
        #
        # Three of those four are safe today only because of HOW they are
        # written: settlements drain to zero, so a second call finds nothing.
        # That is a property of the current bodies, not a guarantee, and it is
        # what a rewrite removes silently. credit_wallet already lacked it and
        # could be paid twice until #147.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:money

      # Added after 2026-08-19, when two promo faults were found in production
      # together: a cancelled order held its redemption forever (SOKHNA30 lost 6
      # of its 50 that way), and the per-customer key changed on sign-in, so the
      # same human could spend a one-per-customer code twice. Neither is visible
      # to tsc, to the linter or to the order smoke test -- the order places
      # perfectly while the discount on it is wrong. 36 assertions across
      # quote_promo_code, apply_order_promo and release-on-cancel.
      #
      # It also carries the one assertion that cannot live inside a transaction:
      # that a request queued through pg_net does NOT survive the rollback.
      # notify_admin_new_order fires on every order insert and pushes to admin
      # devices, so rollback is the only thing standing between CI and a real
      # notification on every pull request. That was assumed until now.
      - name: Exercise the promo ladder and roll it back
        if: steps.creds.outputs.have == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run test:promo

      - name: Place a test order and roll it back
        if: steps.creds.outputs.have == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          npm run smoke:order; code=$?
          if [ $code -ne 0 ]; then
            echo "::notice::First attempt exited $code, retrying once in 10s"
            sleep 10
            npm run smoke:order; code=$?
          fi
          if [ $code -eq 0 ]; then
            echo "::notice::Ordering verified end to end."
          elif [ $code -eq 2 ]; then
            echo "::error::The order smoke test COULD NOT RUN (setup problem -- bad SUPABASE_DB_URL secret, network, or missing test restaurant). This does NOT mean ordering is broken; it means this change is unverified."
          else
            echo "::error::ORDERING IS BROKEN. A real order could not be placed against the test restaurant. Do not merge -- this is the 2026-08-13 failure mode."
          fi
          exit $code
