name: CI

# There is no staging environment and no test suite, so every push goes straight
# to production. This is the minimum guard: refuse to let a build that does not
# typecheck or compile reach main.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # landing/ is hand-written static HTML with no build step, so nothing to do there.
      - name: Typecheck and build
        run: npm run build
