# Build the customer app's AAB and APK on GitHub's machines, not on a laptop.
#
# WHY THIS EXISTS. Building needs the Android SDK, and the Android SDK comes
# from dl.google.com and maven.google.com. Both are blocked from the agent
# sandbox (403 through the CONNECT tunnel), so an agent session can run
# `npm run build` and `npx cap sync` but can never run gradle. Android Studio
# on a laptop was the only other route, and Wael does not have one set up.
#
# GitHub's ubuntu runners ship the Android SDK preinstalled. So: press the
# button, wait a few minutes, download the artifacts. It works from a phone.
#
# HOW TO RUN IT: GitHub → Actions → "Build customer app" → Run workflow.
#
# WHICH FILE TO UPLOAD WHERE.
#   - The .aab (Android App Bundle) is what Play Console wants for the actual
#     store listing. Play Console → your app → Production (or a testing
#     track) → Create new release → upload the .aab.
#   - The .apk is only for sideloading a build onto your own phone to check it
#     before submitting -- Play Store does not accept a bare APK upload for a
#     new app.
#
# ---------------------------------------------------------------------------
# YOU PROBABLY DO NOT NEED TO RE-RUN THIS FOR EVERY CHANGE.
#
# capacitor.config.ts sets `server.url = 'https://app.gosalka.com'`, so the
# app is a thin shell that loads the live site. Web changes -- every screen,
# every fix -- reach an already-installed copy when the customer reopens the
# app. No rebuild, no new Play Store review.
#
# Rebuild ONLY when something NATIVE changes: capacitor.config.ts, a Capacitor
# plugin added or removed, google-services.json, AndroidManifest, the app icon
# or splash screen, or the SDK versions in android/variables.gradle. A native
# change to an app already live on Play Store still needs a new release
# uploaded through Play Console -- this workflow only produces the file, it
# does not publish it.
# ---------------------------------------------------------------------------
#
# SIGNING. The three secrets below are optional but you need them for
# anything installable on a real device outside Play's own re-signing.
# Play App Signing re-signs the AAB for distribution, but Google still checks
# your upload against the "app signing key" the first time, and the Firebase
# Android API key is restricted to package com.gosalka.app plus this
# keystore's release SHA-1
# (1B:FD:48:0F:DD:D3:3A:44:64:2F:EA:00:4A:D1:10:03:6A:DA:BF:B3). An unsigned
# or debug-signed build will not register for push and Play Console will
# reject an unsigned AAB outright.
#
#   Settings → Secrets and variables → Actions → New repository secret
#     ANDROID_KEYSTORE_BASE64   base64 of salka-release.jks (in salka-android.zip)
#     ANDROID_STORE_PASSWORD    from keystore.properties in the same zip
#     ANDROID_KEY_PASSWORD      from keystore.properties in the same zip
#
#   To make the base64:  base64 -w0 salka-release.jks
#
# The keystore is deliberately NOT in the repo. Keep it that way -- anyone with
# it can ship an update that replaces Salka on a customer's phone, and losing
# it means this app can never be updated on Play Store again, only replaced
# under a new package name.

name: Build customer app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor's Android library compiles at Java 21 source/target
      # compatibility (android/build.gradle pulls in @capacitor/android, whose
      # own build.gradle sets sourceCompatibility/targetCompatibility to 21).
      # The runner's default JDK is not 21, so without this step gradle fails
      # with "invalid source release: 21" the moment it tries to compile the
      # capacitor-android module -- nothing to do with app code.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Keep build web assets reproducible with CI and production deploys.
      # This must match .nvmrc and package.json's engines.node exactly.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # capacitor.settings.gradle points at ../node_modules/@capacitor/*/android,
      # so npm ci has to come first or gradle cannot resolve the plugin projects.
      - name: Build the web bundle
        run: npm run build

      # Generates capacitor-cordova-android-plugins/, assets/public and
      # capacitor.config.json. All three are gitignored, so this step is not
      # optional -- a fresh checkout does not contain them.
      - name: Sync Capacitor
        run: npx cap sync android

      # Play Console refuses a versionCode it has already seen, and
      # build.gradle hardcodes 1. The run number is monotonic, so every build
      # supersedes the last -- keep this even after the first Play Store
      # upload, or the next release will be rejected for a duplicate code.
      - name: Stamp versionCode from the run number
        run: |
          sed -i "s/^\( *versionCode \).*/\1${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/^\( *versionName \).*/\1\"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Restore the release keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Building UNSIGNED debug artifacts -- FCM will not register, and Play Console will reject the AAB."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/salka-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=salka-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=salka
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble APK (for sideload testing)
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Bundle AAB (for Play Console upload)
        working-directory: android
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew bundleRelease --no-daemon

      # Printed so the fingerprint can be checked against the Firebase key
      # restriction without anyone having to trust that the right secret was used.
      - name: Report the signing fingerprint
        if: steps.signing.outputs.signed == 'true'
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -i "SHA-1" || true

      - name: Clean up the keystore
        if: always()
        run: rm -f android/salka-release.jks android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: salka-customer-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: salka-customer-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
